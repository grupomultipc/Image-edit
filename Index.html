<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Editor Fotos">
<title>Editor de Fotos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
    background: #000;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: #fff;
    overscroll-behavior: none;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: env(safe-area-inset-top, 14px) 24px 8px;
    padding-top: max(env(safe-area-inset-top), 14px);
    background: #1c1c1e;
    font-size: 12px;
    font-weight: 600;
  }

  .status-icons { display: flex; gap: 6px; align-items: center; }
  .battery { width: 22px; height: 10px; border: 1.5px solid #fff; border-radius: 3px; position: relative; display:inline-block; }
  .battery::after { content:''; position:absolute; right:-5px; top:2px; width:3px; height:5px; background:#fff; border-radius:0 2px 2px 0; }
  .battery-fill { width: 70%; height: 100%; background: #30d158; border-radius: 1px; }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px 10px;
    background: #1c1c1e;
    border-bottom: 0.5px solid rgba(255,255,255,0.1);
  }

  .nav-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    -webkit-user-select: none;
  }
  .nav-btn:active { background: rgba(255,255,255,0.25); }
  .nav-btn.primary { background: #0a84ff; font-weight: 600; }
  .nav-btn.primary:active { background: #0060d0; }
  .nav-btn:disabled { opacity: 0.35; pointer-events: none; }

  .nav-title { color: #fff; font-size: 17px; font-weight: 600; }

  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
    min-height: 200px;
    overflow: hidden;
  }

  #previewCanvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: rgba(255,255,255,0.4);
    padding: 40px 20px;
  }

  .placeholder-icon { font-size: 56px; opacity: 0.35; }
  .placeholder p { font-size: 15px; }

  .open-btn {
    background: rgba(255,255,255,0.1);
    border: 1.5px dashed rgba(255,255,255,0.3);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    padding: 14px 32px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
    margin-top: 8px;
  }
  .open-btn:active { background: rgba(255,255,255,0.2); }

  #fileInput { display: none; }

  .toast {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(44,44,46,0.96);
    color: #fff;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    transition: all 0.25s ease;
    white-space: nowrap;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tools-panel {
    background: #1c1c1e;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding-bottom: max(env(safe-area-inset-bottom), 16px);
  }

  .tool-tabs {
    display: flex;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }

  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    font-weight: 500;
    padding: 10px 4px 8px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    -webkit-user-select: none;
  }
  .tab-btn.active { color: #0a84ff; border-bottom-color: #0a84ff; }
  .tab-btn:active { color: #0a84ff; }
  .tab-icon { font-size: 20px; }

  .filters-scroll {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filters-scroll::-webkit-scrollbar { display: none; }

  .filter-pill {
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid transparent;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-user-select: none;
  }
  .filter-pill:active { transform: scale(0.95); }
  .filter-pill.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }

  .adj-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 14px 16px;
  }

  .adj-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-weight: 500;
    padding: 12px 10px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.12s;
    -webkit-user-select: none;
  }
  .adj-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.97); }
  .adj-icon { font-size: 18px; }

  .action-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px 0;
    border-top: 0.5px solid rgba(255,255,255,0.08);
  }

  .action-btn {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 8px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.12s;
    -webkit-user-select: none;
  }
  .action-btn:active { background: rgba(255,255,255,0.22); }
  .action-btn.danger { color: #ff453a; }
  .action-btn.save { background: #0a84ff; }
  .action-btn.save:active { background: #0060d0; }
  .action-btn:disabled { opacity: 0.35; pointer-events: none; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Spinner */
  .spinner-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .spinner-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .filename-bar {
    background: #2c2c2e;
    padding: 6px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    text-align: center;
    display: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filename-bar.show { display: block; }
</style>
</head>
<body>

<div class="status-bar">
  <span id="clock">9:41</span>
  <div class="status-icons">
    <span style="font-size:11px;">▲▲▲</span>
    <div class="battery"><div class="battery-fill"></div></div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn" onclick="resetImage()">Restablecer</button>
  <span class="nav-title">Editor de Fotos</span>
  <button class="nav-btn primary" id="saveBtn" onclick="saveImage()" disabled>Guardar</button>
</div>

<div class="filename-bar" id="filenameBar"></div>

<div class="canvas-area" id="canvasArea">
  <canvas id="previewCanvas"></canvas>

  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">📷</div>
    <p>Ninguna imagen abierta</p>
    <label for="fileInput" class="open-btn">
      <span style="font-size:18px;">+</span> Abrir foto
    </label>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<div class="tools-panel">
  <div class="tool-tabs">
    <button class="tab-btn active" onclick="switchTab('filters',this)">
      <span class="tab-icon">✨</span>Filtros
    </button>
    <button class="tab-btn" onclick="switchTab('adjust',this)">
      <span class="tab-icon">⚙️</span>Ajustes
    </button>
    <button class="tab-btn" onclick="switchTab('transform',this)">
      <span class="tab-icon">🔃</span>Transformar
    </button>
  </div>

  <div id="tab-filters" class="tab-content active">
    <div class="filters-scroll">
      <button class="filter-pill active" onclick="applyFilter('original',this)">Original</button>
      <button class="filter-pill" onclick="applyFilter('gris',this)">Gris</button>
      <button class="filter-pill" onclick="applyFilter('sepia',this)">Sepia</button>
      <button class="filter-pill" onclick="applyFilter('invertir',this)">Invertir</button>
      <button class="filter-pill" onclick="applyFilter('contorno',this)">Contorno</button>
      <button class="filter-pill" onclick="applyFilter('saturar',this)">Saturar</button>
      <button class="filter-pill" onclick="applyFilter('nitidez',this)">Nitidez</button>
      <button class="filter-pill" onclick="applyFilter('suavizar',this)">Suavizar</button>
    </div>
  </div>

  <div id="tab-adjust" class="tab-content">
    <div class="adj-grid">
      <button class="adj-btn" onclick="applyAdj('brillo+')"><span class="adj-icon">☀️</span> Brillo +</button>
      <button class="adj-btn" onclick="applyAdj('brillo-')"><span class="adj-icon">🌑</span> Brillo -</button>
      <button class="adj-btn" onclick="applyAdj('contraste+')"><span class="adj-icon">⚡</span> Contraste +</button>
      <button class="adj-btn" onclick="applyAdj('contraste-')"><span class="adj-icon">⚫</span> Contraste -</button>
      <button class="adj-btn" onclick="applyAdj('saturar')"><span class="adj-icon">🌈</span> Saturar</button>
      <button class="adj-btn" onclick="applyAdj('desat')"><span class="adj-icon">🖼️</span> Desat.</button>
    </div>
  </div>

  <div id="tab-transform" class="tab-content">
    <div class="adj-grid">
      <button class="adj-btn" onclick="applyTransform('rotar')"><span class="adj-icon">🔃</span> Rotar 90°</button>
      <button class="adj-btn" onclick="applyTransform('espejo')"><span class="adj-icon">↔️</span> Espejo</button>
      <button class="adj-btn" onclick="applyTransform('voltear')"><span class="adj-icon">↕️</span> Voltear</button>
      <button class="adj-btn" onclick="applyTransform('miniatura')"><span class="adj-icon">🔲</span> Miniatura</button>
    </div>
  </div>

  <div class="action-bar">
    <button class="action-btn" onclick="document.getElementById('fileInput').click()">📂 Abrir</button>
    <button class="action-btn danger" onclick="resetImage()">↩️ Reset</button>
    <button class="action-btn save" id="saveBtn2" onclick="saveImage()" disabled>💾 Guardar</button>
  </div>
</div>

<script>
let imgOriginal = null;
let imgActual = null;
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

// Reloj en tiempo real
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = h+':'+m;
}
updateClock();
setInterval(updateClock, 10000);

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  showSpinner(true);
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      imgOriginal = ctx.getImageData(0, 0, canvas.width, canvas.height);
      imgActual = ctx.getImageData(0, 0, canvas.width, canvas.height);
      document.getElementById('placeholder').style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('saveBtn2').disabled = false;
      document.getElementById('filenameBar').textContent = '📁 ' + file.name;
      document.getElementById('filenameBar').classList.add('show');
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-pill').classList.add('active');
      showSpinner(false);
      showToast('Imagen cargada ✓');
    };
    img.onerror = function() { showSpinner(false); showToast('Error al cargar imagen'); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  this.value = '';
});

function showSpinner(v) {
  document.getElementById('spinner').classList.toggle('show', v);
}

function showCanvas() {
  canvas.width = imgActual.width;
  canvas.height = imgActual.height;
  ctx.putImageData(imgActual, 0, 0);
}

function applyFilter(name, btn) {
  if (!imgOriginal) { showToast('Abre una imagen primero'); return; }
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  showSpinner(true);

  setTimeout(() => {
    const src = new ImageData(new Uint8ClampedArray(imgOriginal.data), imgOriginal.width, imgOriginal.height);
    const d = src.data;

    if (name === 'original') { imgActual = src; showCanvas(); showSpinner(false); return; }

    if (name === 'gris') {
      for (let i=0;i<d.length;i+=4) {
        const g=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
        d[i]=d[i+1]=d[i+2]=g;
      }
    } else if (name === 'sepia') {
      for (let i=0;i<d.length;i+=4) {
        const r=d[i],g=d[i+1],b=d[i+2];
        d[i]   = Math.min(255,r*0.393+g*0.769+b*0.189);
        d[i+1] = Math.min(255,r*0.349+g*0.686+b*0.168);
        d[i+2] = Math.min(255,r*0.272+g*0.534+b*0.131);
      }
    } else if (name === 'invertir') {
      for (let i=0;i<d.length;i+=4) { d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; }
    } else if (name === 'contorno') {
      const tmp=new Uint8ClampedArray(d); const w=src.width;
      for(let y=1;y<src.height-1;y++) for(let x=1;x<w-1;x++) {
        const i=(y*w+x)*4;
        for(let c=0;c<3;c++){
          const gx=-tmp[(y-1)*w*4+(x-1)*4+c]+tmp[(y-1)*w*4+(x+1)*4+c]
                  -2*tmp[y*w*4+(x-1)*4+c]+2*tmp[y*w*4+(x+1)*4+c]
                  -tmp[(y+1)*w*4+(x-1)*4+c]+tmp[(y+1)*w*4+(x+1)*4+c];
          const gy=-tmp[(y-1)*w*4+(x-1)*4+c]-2*tmp[(y-1)*w*4+x*4+c]-tmp[(y-1)*w*4+(x+1)*4+c]
                  +tmp[(y+1)*w*4+(x-1)*4+c]+2*tmp[(y+1)*w*4+x*4+c]+tmp[(y+1)*w*4+(x+1)*4+c];
          d[i+c]=Math.min(255,Math.sqrt(gx*gx+gy*gy));
        }
      }
    } else if (name === 'saturar') {
      for(let i=0;i<d.length;i+=4){
        const r=d[i],g=d[i+1],b=d[i+2];
        const gray=r*0.299+g*0.587+b*0.114;
        d[i]=Math.min(255,gray+(r-gray)*2);
        d[i+1]=Math.min(255,gray+(g-gray)*2);
        d[i+2]=Math.min(255,gray+(b-gray)*2);
      }
    } else if (name === 'nitidez') {
      const tmp=new Uint8ClampedArray(d); const w=src.width;
      const k=[-1,-1,-1,-1,9,-1,-1,-1,-1];
      for(let y=1;y<src.height-1;y++) for(let x=1;x<w-1;x++){
        const i=(y*w+x)*4;
        for(let c=0;c<3;c++){
          let v=0;
          for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++) v+=tmp[((y+ky)*w+(x+kx))*4+c]*k[(ky+1)*3+(kx+1)];
          d[i+c]=Math.min(255,Math.max(0,v));
        }
      }
    } else if (name === 'suavizar') {
      const tmp=new Uint8ClampedArray(d); const w=src.width;
      for(let y=1;y<src.height-1;y++) for(let x=1;x<w-1;x++){
        const i=(y*w+x)*4;
        for(let c=0;c<3;c++){
          let s=0;
          for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++) s+=tmp[((y+ky)*w+(x+kx))*4+c];
          d[i+c]=s/9;
        }
      }
    }

    imgActual=src;
    showCanvas();
    showSpinner(false);
    showToast('Filtro aplicado');
  }, 30);
}

function applyAdj(name) {
  if (!imgActual) { showToast('Abre una imagen primero'); return; }
  showSpinner(true);
  setTimeout(() => {
    const src=new ImageData(new Uint8ClampedArray(imgActual.data),imgActual.width,imgActual.height);
    const d=src.data;
    if (name==='brillo+') {
      for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.4);d[i+1]=Math.min(255,d[i+1]*1.4);d[i+2]=Math.min(255,d[i+2]*1.4);}
    } else if (name==='brillo-') {
      for(let i=0;i<d.length;i+=4){d[i]*=0.6;d[i+1]*=0.6;d[i+2]*=0.6;}
    } else if (name==='contraste+') {
      const f=1.5,b=128*(1-f);
      for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,Math.max(0,d[i]*f+b));d[i+1]=Math.min(255,Math.max(0,d[i+1]*f+b));d[i+2]=Math.min(255,Math.max(0,d[i+2]*f+b));}
    } else if (name==='contraste-') {
      const f=0.6,b=128*(1-f);
      for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,Math.max(0,d[i]*f+b));d[i+1]=Math.min(255,Math.max(0,d[i+1]*f+b));d[i+2]=Math.min(255,Math.max(0,d[i+2]*f+b));}
    } else if (name==='saturar') {
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const gr=r*0.299+g*0.587+b*0.114;d[i]=Math.min(255,gr+(r-gr)*2);d[i+1]=Math.min(255,gr+(g-gr)*2);d[i+2]=Math.min(255,gr+(b-gr)*2);}
    } else if (name==='desat') {
      for(let i=0;i<d.length;i+=4){const gr=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;const f=0.3;d[i]=d[i]*f+gr*(1-f);d[i+1]=d[i+1]*f+gr*(1-f);d[i+2]=d[i+2]*f+gr*(1-f);}
    }
    imgActual=src; showCanvas(); showSpinner(false); showToast('Ajuste aplicado');
  }, 30);
}

function applyTransform(name) {
  if (!imgActual) { showToast('Abre una imagen primero'); return; }
  showSpinner(true);
  setTimeout(() => {
    const w=imgActual.width, h=imgActual.height, src=imgActual.data;
    let dst;
    if (name==='rotar') {
      dst=new ImageData(h,w);
      const dd=dst.data;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const si=(y*w+x)*4; const di=((h-1-x)*h+y)*4; // corrected
        // rotate 90 CW: new(x,y) = old(height-1-y, x)
        const ni=((w-1-x)*h+y)*4;
        dd[ni]=src[si]; dd[ni+1]=src[si+1]; dd[ni+2]=src[si+2]; dd[ni+3]=src[si+3];
      }
    } else if (name==='espejo') {
      dst=new ImageData(w,h); const dd=dst.data;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const si=(y*w+x)*4; const di=(y*w+(w-1-x))*4;
        dd[di]=src[si]; dd[di+1]=src[si+1]; dd[di+2]=src[si+2]; dd[di+3]=src[si+3];
      }
    } else if (name==='voltear') {
      dst=new ImageData(w,h); const dd=dst.data;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const si=(y*w+x)*4; const di=((h-1-y)*w+x)*4;
        dd[di]=src[si]; dd[di+1]=src[si+1]; dd[di+2]=src[si+2]; dd[di+3]=src[si+3];
      }
    } else if (name==='miniatura') {
      const nw=150,nh=150;
      const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
      tmp.getContext('2d').putImageData(imgActual,0,0);
      const off=document.createElement('canvas'); off.width=nw; off.height=nh;
      off.getContext('2d').drawImage(tmp,0,0,nw,nh);
      dst=off.getContext('2d').getImageData(0,0,nw,nh);
    }
    imgActual=dst; showCanvas(); showSpinner(false); showToast('Transformación aplicada');
  }, 30);
}

function resetImage() {
  if (!imgOriginal) return;
  imgActual=new ImageData(new Uint8ClampedArray(imgOriginal.data),imgOriginal.width,imgOriginal.height);
  showCanvas();
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-pill').classList.add('active');
  showToast('Imagen restablecida');
}

function saveImage() {
  if (!imgActual) return;
  showCanvas();
  const link=document.createElement('a');
  link.download='foto_editada.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  showToast('Foto guardada ✓');
}

function switchTab(name,btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
